<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Autobattler AI Arena</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #12161c;
      color: #e6ebf5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 16, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-box {
      background: #1c222c;
      padding: 35px;
      border-radius: 10px;
      width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      text-align: center;
    }

    .subtitle { color: #8c96a5; margin-top: -10px; margin-bottom: 25px; }

    .input-group {
      text-align: left;
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: #8c96a5;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background: #12161c;
      border: 1px solid #354254;
      border-radius: 5px;
      color: #fff;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      background: #00d2ff;
      color: #000;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover { background: #33dcff; }
    .error-msg { color: #ff4b4b; margin-top: 15px; font-size: 13px; min-height: 18px; }
    .hidden { display: none !important; }

    .main-container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      padding: 20px;
    }

    #arena {
      background: #0a0c10;
      border: 2px solid #232a36;
      border-radius: 4px;
    }

    .hud {
      width: 320px;
      background: #1c222c;
      padding: 20px;
      border-radius: 8px;
    }

    .player-card { margin-bottom: 12px; }
    .player-title { font-weight: bold; font-size: 17px; }
    .color-a { color: #00d2ff; }
    .color-b { color: #ff4b4b; }
    .score { font-size: 22px; font-weight: bold; margin-top: 4px; }

    .control-section {
      background: #12161c;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      text-align: left;
    }

    .control-section label {
      font-size: 12px;
      color: #8c96a5;
      display: block;
      margin-bottom: 6px;
    }

    #model-select {
      width: 100%;
      padding: 8px;
      background: #1c222c;
      border: 1px solid #354254;
      color: #ffdc00;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 8px;
    }

    #model-select option {
      background-color: #1c222c;
      color: #ffdc00;
    }

    .upload-btn {
      background: #00d2ff;
      color: #000;
      font-size: 13px;
      padding: 8px;
      margin-top: 4px;
      font-weight: bold;
    }
    .upload-btn:hover { background: #33dcff; }

    .status-box {
      background: #12161c;
      padding: 10px;
      border-radius: 5px;
      color: #3cc878;
      font-weight: bold;
      margin: 12px 0;
      font-size: 13px;
      text-align: center;
    }

    .action-btn { background: #3cc878; color: #fff; margin-top: 5px; }
    .action-btn:hover { background: #4ee08e; }
    .stop { background: #ff4b4b !important; }
    .stop:hover { background: #ff6b6b !important; }
    .logout { background: #354254; color: #fff; margin-top: 8px; }
    .logout:hover { background: #475569; }

    .instructions {
      font-size: 12px;
      color: #8c96a5;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="login-modal" class="modal">
    <div class="modal-box">
      <h2>2D AUTOBATTLER ARENA</h2>
      <p class="subtitle">Fight Your Trained AI Clones</p>
      
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" id="username" placeholder="e.g. Alice" maxlength="12">
      </div>

      <div class="input-group">
        <label>Room Password</label>
        <input type="password" id="password" placeholder="Enter room password">
      </div>

      <div class="input-group">
        <label>Server WebSocket URL</label>
        <input type="text" id="server-url" value="wss://autobattler-backend.onrender.com/ws">
      </div>

      <button id="btn-login" onclick="connect()">Enter Arena</button>
      <div id="login-error" class="error-msg"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="main-container">
      <canvas id="arena" width="280" height="720"></canvas>

      <div class="hud">
        <h2>ONLINE ARENA</h2>
        <hr style="border-color:#232a36; margin-bottom:15px;">
        
        <div class="player-card">
          <div class="player-title color-a" id="hud-a-name">Player A (You): Connecting...</div>
          <div class="score" id="hud-a-score">Score: 0</div>
        </div>

        <div class="player-card">
          <div class="player-title color-b" id="hud-b-name">Player B (Model): Loading...</div>
          <div class="score" id="hud-b-score">Score: 0</div>
        </div>
        <hr style="border-color:#232a36; margin-bottom:15px;">

        <div class="control-section">
          <label>Opponent AI Model:</label>
          <select id="model-select" onchange="onModelSelected()">
            <option value="">Upload or select a model...</option>
          </select>

          <input type="file" id="file-uploader" accept=".pt" style="display:none" onchange="uploadLocalModel(this)">
          <button class="upload-btn" onclick="document.getElementById('file-uploader').click()">📁 Upload .pt Model from PC</button>
        </div>

        <div id="match-status" class="status-box">Connecting to server...</div>

        <button id="btn-start" class="action-btn" onclick="startMatch()">▶ Start Match vs Model</button>
        <button id="btn-stop" class="action-btn stop hidden" onclick="stopMatch()">⏹ Stop Match</button>
        <button id="btn-logout" class="action-btn logout" onclick="logout()">Log Out</button>

        <div class="instructions">
          <strong>CONTROLS:</strong><br>
          Move: <code>W, A, S, D</code> or <code>Arrow Keys</code><br>
          Auto-shoots straight forward on cooldown!
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCALE_X = 5.6;
    const SCALE_Y = 2.4;
    const DEAD_ZONE_TOP = 100.0 * SCALE_Y;
    const DEAD_ZONE_HEIGHT = 100.0 * SCALE_Y;

    let ws = null;
    let heartbeatInterval = null;
    let keys = { left: false, right: false, up: false, down: false };

    const canvas = document.getElementById("arena");
    const ctx = canvas.getContext("2d");

    drawInitialArena();

    function drawInitialArena() {
      ctx.fillStyle = "#0a0c10";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#161a24";
      ctx.fillRect(0, DEAD_ZONE_TOP, canvas.width, DEAD_ZONE_HEIGHT);

      ctx.fillStyle = "#00d2ff";
      ctx.beginPath();
      ctx.moveTo(140, 20 * SCALE_Y + 8);
      ctx.lineTo(140 - 8, 20 * SCALE_Y - 6);
      ctx.lineTo(140 + 8, 20 * SCALE_Y - 6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ff4b4b";
      ctx.beginPath();
      ctx.moveTo(140, 280 * SCALE_Y - 8);
      ctx.lineTo(140 - 8, 280 * SCALE_Y + 6);
      ctx.lineTo(140 + 8, 280 * SCALE_Y + 6);
      ctx.closePath();
      ctx.fill();
    }

    function connect() {
      const username = document.getElementById("username").value.trim() || "Player";
      const password = document.getElementById("password").value;
      const serverUrl = document.getElementById("server-url").value.trim();
      const errorDiv = document.getElementById("login-error");

      errorDiv.innerText = "Connecting to server...";

      try {
        ws = new WebSocket(serverUrl);
      } catch (e) {
        errorDiv.innerText = "Invalid WebSocket URL format.";
        return;
      }

      ws.onopen = () => {
        ws.send(JSON.stringify({ username, password }));
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        heartbeatInterval = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "ping" }));
          }
        }, 5000);
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "init") {
          document.getElementById("login-modal").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
          document.getElementById("hud-a-name").innerText = `Player A (You): ${data.username}`;
          updateModelDropdown(data.models, data.selected_model);
          document.getElementById("match-status").innerText = "Model Ready! Click Start Match below.";
          document.getElementById("match-status").style.color = "#3cc878";
          drawInitialArena();
        } 
        else if (data.type === "error") {
          errorDiv.innerText = data.message;
        }
        else if (data.type === "models_updated") {
          updateModelDropdown(data.models, data.selected_model);
          document.getElementById("match-status").innerText = `Model Ready: ${data.selected_model}`;
          document.getElementById("match-status").style.color = "#3cc878";
        }
        else if (data.type === "state") {
          renderState(data);
        }
      };

      ws.onclose = () => {
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        document.getElementById("match-status").innerText = "Disconnected from server. Check server.py.";
        document.getElementById("match-status").style.color = "#ff4b4b";
      };
    }

    function updateModelDropdown(models, selectedModel) {
      const select = document.getElementById("model-select");
      if (!select) return;
      select.innerHTML = "";
      if (models.length === 0) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.innerText = "Upload a .pt model below...";
        select.appendChild(opt);
        return;
      }
      for (const m of models) {
        const opt = document.createElement("option");
        opt.value = m;
        opt.innerText = m;
        if (m === selectedModel) opt.selected = true;
        select.appendChild(opt);
      }
    }

    function onModelSelected() {
      const select = document.getElementById("model-select");
      if (select.value && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "select_model", model: select.value }));
      }
    }

    // FAST DIRECT BINARY HTTP UPLOAD (No 128KB WebSocket Limit!)
    async function uploadLocalModel(input) {
      const file = input.files[0];
      if (!file) return;

      const statusDiv = document.getElementById("match-status");
      statusDiv.innerText = `Uploading ${file.name}...`;
      statusDiv.style.color = "#ffdc00";

      try {
        const serverUrl = document.getElementById("server-url").value.trim();
        const httpUrl = serverUrl.replace("wss://", "https://").replace("ws://", "http://").replace("/ws", "");

        const response = await fetch(`${httpUrl}/api/upload_model`, {
          method: "POST",
          headers: {
            "X-Filename": file.name
          },
          body: file
        });

        if (!response.ok) throw new Error("Upload failed on server.");

        const resData = await response.json();
        updateModelDropdown(resData.models, resData.filename);
        statusDiv.innerText = `✔ ${file.name} Uploaded & Loaded!`;
        statusDiv.style.color = "#3cc878";
      } catch (err) {
        statusDiv.innerText = `Upload Error: ${err.message}`;
        statusDiv.style.color = "#ff4b4b";
      }

      input.value = "";
    }

    function startMatch() {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        document.getElementById("match-status").innerText = "Not connected to server.";
        return;
      }
      ws.send(JSON.stringify({ type: "start_match", solo: true }));
      document.getElementById("btn-start").classList.add("hidden");
      document.getElementById("btn-stop").classList.remove("hidden");
      document.getElementById("match-status").innerText = "Match in progress!";
    }

    function stopMatch() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "stop_match" }));
      }
      document.getElementById("btn-start").classList.remove("hidden");
      document.getElementById("btn-stop").classList.add("hidden");
      document.getElementById("match-status").innerText = "Match stopped.";
    }

    function logout() {
      if (ws) ws.close();
      location.reload();
    }

    window.addEventListener("keydown", (e) => {
      let changed = false;
      if (["ArrowLeft", "KeyA"].includes(e.code) && !keys.left) { keys.left = true; changed = true; }
      if (["ArrowRight", "KeyD"].includes(e.code) && !keys.right) { keys.right = true; changed = true; }
      if (["ArrowUp", "KeyW"].includes(e.code) && !keys.up) { keys.up = true; changed = true; }
      if (["ArrowDown", "KeyS"].includes(e.code) && !keys.down) { keys.down = true; changed = true; }

      if (changed && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "keys", ...keys }));
      }
    });

    window.addEventListener("keyup", (e) => {
      let changed = false;
      if (["ArrowLeft", "KeyA"].includes(e.code) && keys.left) { keys.left = false; changed = true; }
      if (["ArrowRight", "KeyD"].includes(e.code) && keys.right) { keys.right = false; changed = true; }
      if (["ArrowUp", "KeyW"].includes(e.code) && keys.up) { keys.up = false; changed = true; }
      if (["ArrowDown", "KeyS"].includes(e.code) && keys.down) { keys.down = false; changed = true; }

      if (changed && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "keys", ...keys }));
      }
    });

    function renderState(data) {
      document.getElementById("hud-a-name").innerText = `Player A (You): ${data.player_a.name}`;
      document.getElementById("hud-a-score").innerText = `Score: ${data.player_a.score}`;

      document.getElementById("hud-b-name").innerText = `Player B (Model): ${data.player_b.name}`;
      document.getElementById("hud-b-score").innerText = `Score: ${data.player_b.score}`;

      ctx.fillStyle = "#0a0c10";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#161a24";
      ctx.fillRect(0, DEAD_ZONE_TOP, canvas.width, DEAD_ZONE_HEIGHT);

      for (const b of data.bullets) {
        ctx.fillStyle = (b.owner === "A") ? "#00d2ff" : "#ff4b4b";
        ctx.beginPath();
        ctx.arc(b.x * SCALE_X, b.y * SCALE_Y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      const ax = data.player_a.x * SCALE_X;
      const ay = data.player_a.y * SCALE_Y;
      ctx.fillStyle = "#00d2ff";
      ctx.beginPath();
      ctx.moveTo(ax, ay + 8);
      ctx.lineTo(ax - 8, ay - 6);
      ctx.lineTo(ax + 8, ay - 6);
      ctx.closePath();
      ctx.fill();

      const bx = data.player_b.x * SCALE_X;
      const by = data.player_b.y * SCALE_Y;
      ctx.fillStyle = "#ff4b4b";
      ctx.beginPath();
      ctx.moveTo(bx, by - 8);
      ctx.lineTo(bx - 8, by + 6);
      ctx.lineTo(bx + 8, by + 6);
      ctx.closePath();
      ctx.fill();
    }
  </script>
</body>
</html>
