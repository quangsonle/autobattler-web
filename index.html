<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Autobattler Web Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login / Gating Overlay -->
  <div id="login-modal" class="modal">
    <div class="modal-box">
      <h2>2D AUTOBATTLER ARENA</h2>
      <p class="subtitle">Online Dueling & AI Testing</p>
      
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" id="username" placeholder="e.g. Alice" maxlength="12">
      </div>

      <div class="input-group">
        <label>Room Password</label>
        <input type="password" id="password" placeholder="Enter room password">
      </div>

      <div class="input-group">
        <label>Server WebSocket URL</label>
        <input type="text" id="server-url" value="wss://autobattler-backend.onrender.com/ws">
      </div>

      <button id="btn-login" onclick="connect()">Enter Arena</button>
      <div id="login-error" class="error-msg"></div>
    </div>
  </div>

  <!-- Main Game Interface -->
  <div id="app" class="hidden">
    <div class="main-container">
      <canvas id="arena" width="280" height="720"></canvas>

      <div class="hud">
        <h2>ONLINE ARENA</h2>
        <hr>
        
        <div class="player-card">
          <div class="player-title color-a" id="hud-a-name">Player A: Loading...</div>
          <div class="score" id="hud-a-score">Score: 0</div>
        </div>

        <div class="player-card">
          <div class="player-title color-b" id="hud-b-name">Player B: Loading...</div>
          <div class="score" id="hud-b-score">Score: 0</div>
        </div>
        <hr>

        <!-- Model Selection Panel -->
        <div class="control-section">
          <label>Opponent AI Model:</label>
          <select id="model-select" onchange="onModelSelected()">
            <option value="Greedy AI">Greedy AI</option>
          </select>

          <!-- Upload local .pt model directly from your PC -->
          <input type="file" id="file-uploader" accept=".pt" style="display:none" onchange="uploadLocalModel(this)">
          <button class="upload-btn" onclick="document.getElementById('file-uploader').click()">📁 Upload .pt Model from PC</button>
        </div>

        <div id="match-status" class="status-box">Select a model and start!</div>

        <button id="btn-start" class="action-btn" onclick="startMatch()">▶ Start Match vs Model</button>
        <button id="btn-stop" class="action-btn stop hidden" onclick="stopMatch()">⏹ Stop Match</button>
        <button id="btn-logout" class="action-btn logout" onclick="logout()">Log Out</button>

        <div class="instructions">
          <strong>CONTROLS:</strong><br>
          Move: <code>W, A, S, D</code> or <code>Arrow Keys</code><br>
          Auto-shoots straight on cooldown!
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
